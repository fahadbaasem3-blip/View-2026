<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="format-detection" content="telephone=no" />
  <title>مطل سكني | لوحة مخزون المبيعات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --ink:#195028;
      --ink-2:#133e20;
      --paper:#f7f4ec;
      --paper-2:#eee8db;
      --gold:#8d6f3a;
      --gold-2:#c7aa76;
      --green:#195028;
      --green-soft:#edf4ef;
      --sold:#6f746f;
      --sold-soft:#e3e3de;
      --white:#ffffff;
      --line:rgba(25,80,40,.14);
      --shadow:0 16px 48px rgba(25,80,40,.08);
      --radius:24px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
      background:
        radial-gradient(circle at 7% 0%,rgba(141,111,58,.12),transparent 30%),
        linear-gradient(180deg,#fbfaf6 0%,#f2eee5 100%);
      color:var(--ink);
      min-height:100vh;
    }
    button,input,select{font:inherit}
    .shell{max-width:1480px;margin:auto;padding:26px 24px 60px}
    .topbar{
      display:flex;align-items:center;justify-content:space-between;gap:20px;
      background:rgba(255,255,255,.96);color:var(--ink);border-radius:30px;padding:18px 24px;
      border:1px solid rgba(25,80,40,.10);box-shadow:0 18px 60px rgba(25,80,40,.10);position:relative;overflow:hidden;
    }
    .topbar:before{content:"";position:absolute;right:0;left:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.9}.topbar:after{content:"";position:absolute;inset:auto -80px -140px auto;width:340px;height:340px;border:1px solid rgba(25,80,40,.10);border-radius:50%}
    .brand{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
    .brand-logo{display:block;width:178px;max-width:34vw;height:auto;object-fit:contain}
    .brand-copy{padding-right:16px;border-right:1px solid rgba(25,80,40,.18)}
    .brand-copy strong{display:block;font-family:"Alexandria";font-size:14px;font-weight:600;color:var(--gold);margin-bottom:3px}
    .brand-copy p{margin:0;color:rgba(25,80,40,.58);font-size:11px}
    .hero-note{position:relative;z-index:1;text-align:left;color:rgba(25,80,40,.72);font-size:13px;line-height:1.8}
    .hero-note strong{display:block;color:var(--gold);font-family:"Alexandria";font-size:15px}

    .overview{display:grid;grid-template-columns:1.15fr repeat(4,1fr);gap:14px;margin:18px 0}
    .stat{background:rgba(255,253,248,.76);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.7);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-height:112px;display:flex;flex-direction:column;justify-content:space-between}
    .stat.primary{background:linear-gradient(135deg,var(--green),#133e20);color:var(--white);border-color:rgba(141,111,58,.32)}
    .stat .label{font-size:12px;color:#777a73}.stat.primary .label{color:#bbbdb7}
    .stat .value{font-family:"Alexandria";font-size:28px;font-weight:600;letter-spacing:-1px;line-height:1.15;color:var(--green)}.stat.primary .value{color:white}
    .stat .sub{font-size:11px;color:#888c85}.stat.primary .sub{color:rgba(255,255,255,.72)}
    .stat .mini{display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block}.dot.available{background:var(--green)}.dot.sold{background:var(--sold)}

    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(255,253,248,.72);border:1px solid rgba(255,255,255,.9);padding:12px;border-radius:20px;box-shadow:var(--shadow);margin-bottom:20px}
    .filters{display:flex;gap:8px;flex-wrap:wrap}
    .chip{border:1px solid var(--line);background:#fffaf0;color:#3d413c;padding:9px 13px;border-radius:999px;cursor:pointer;transition:.2s}
    .chip:hover{transform:translateY(-1px)}
    .chip.active{background:var(--green);color:white;border-color:var(--green);box-shadow:0 6px 18px rgba(25,80,40,.16)}
    .search{min-width:260px;position:relative}.search input{width:100%;border:1px solid var(--line);background:white;border-radius:999px;padding:10px 40px 10px 14px;outline:none}.search span{position:absolute;right:14px;top:9px;color:#7c807a}

    .legend{display:flex;gap:16px;align-items:center;margin:10px 4px 18px;font-size:12px;color:#666a64}
    .legend span{display:inline-flex;gap:7px;align-items:center}

    .floor{background:rgba(255,253,248,.62);border:1px solid rgba(255,255,255,.86);border-radius:28px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
    .floor-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .floor-title{display:flex;align-items:center;gap:12px}
    .floor-title h2{font-family:"Alexandria";font-size:18px;margin:0;font-weight:600;color:var(--green)}
    .floor-badge{font-size:11px;padding:5px 9px;border-radius:999px;background:rgba(141,111,58,.12);color:#795f31;border:1px solid rgba(141,111,58,.18)}
    .floor-summary{font-size:12px;color:#747770;display:flex;gap:12px;flex-wrap:wrap}
    .units{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
    .unit{position:relative;border:1px solid var(--line);background:white;border-radius:18px;padding:13px;min-height:150px;cursor:pointer;transition:.2s;overflow:hidden}
    .unit:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(20,25,20,.1)}
    .unit.available{border-color:rgba(25,80,40,.28);background:linear-gradient(180deg,#fff 0%,#f2f7f3 100%)}
    .unit.available:before{content:"";position:absolute;right:0;left:0;top:0;height:4px;background:var(--green)}
    .unit.sold{background:linear-gradient(180deg,#f7f7f4,#ecece7);color:#858984;border-color:#d8d9d4}
    .unit.sold:before{content:"";position:absolute;right:0;left:0;top:0;height:4px;background:#9a9e99}
    .unit-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
    .unit-no{font-family:"Alexandria";font-size:17px;font-weight:600;letter-spacing:-.4px}.unit.available .unit-no{color:var(--green)}
    .category{font-family:"Alexandria";font-size:10px;border:1px solid currentColor;border-radius:999px;padding:3px 7px;opacity:.75}
    .status{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600}.status:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}.available .status{color:var(--green)}.sold .status{color:#777b76}
    .price{font-family:"Alexandria";font-size:19px;font-weight:600;margin:7px 0 3px}.unit.available .price{color:var(--gold)}.price small{font-size:10px;font-weight:400;color:#7d817b}
    .sold .price{text-decoration:line-through;text-decoration-thickness:1px;opacity:.4}
    .meta{font-size:11px;color:#747972;line-height:1.8}.sold .meta{color:#92958f}
    .unit .sold-stamp{display:none}.unit.sold .sold-stamp{display:block;position:absolute;left:10px;bottom:10px;font-family:"Alexandria";font-size:10px;border:1px solid #b5b7b3;border-radius:999px;padding:4px 8px;color:#777a76}
    .quick-share{margin-top:10px;width:100%;border:1px solid rgba(25,80,40,.20);background:rgba(25,80,40,.08);color:var(--green);border-radius:12px;padding:7px 9px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:10px;font-weight:700;cursor:pointer;transition:.2s}.quick-share:hover{background:var(--green);color:white;transform:translateY(-1px)}.quick-share svg{width:14px;height:14px;fill:currentColor}.sold .quick-share{display:none}
    .unit.hidden{display:none}.floor.hidden{display:none}

    .footer-note{display:flex;justify-content:space-between;gap:15px;padding:12px 5px;color:#7a7d77;font-size:11px}

    .modal{position:fixed;inset:0;background:rgba(9,11,9,.58);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.show{display:flex}
    .modal-card{width:min(610px,100%);background:#faf7f0;border-radius:28px;padding:24px;box-shadow:0 28px 80px rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.65)}
    .modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.modal-head h3{font-family:"Alexandria";font-size:24px;margin:0}.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:white;cursor:pointer}
    .detail-status{margin-top:8px;font-size:12px;font-weight:600}.detail-status.available{color:var(--green)}.detail-status.sold{color:var(--sold)}
    .details{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.detail{background:white;border:1px solid var(--line);border-radius:16px;padding:12px}.detail span{display:block;color:#858880;font-size:10px;margin-bottom:3px}.detail strong{font-size:14px;font-weight:600}
    .modal-price{background:var(--ink);color:white;border-radius:18px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.modal-price span{color:#bbbdb7;font-size:11px}.modal-price strong{font-family:"Alexandria";font-size:22px;color:var(--gold-2)}
    .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.action{flex:1;min-width:145px;border-radius:14px;padding:11px;border:0;cursor:pointer;font-weight:600}.action.primary{background:var(--green);color:white}.action.whatsapp{background:var(--gold);color:white;border:1px solid rgba(141,111,58,.2)}.action.secondary{background:#efe8dc;color:var(--green)}
    .pdf-stage{position:fixed;left:-99999px;top:0;width:794px;height:1123px;pointer-events:none;opacity:1;z-index:-1}
    .pdf-sheet{width:794px;height:1123px;background:#f7f4ec;color:#195028;position:relative;overflow:hidden;font-family:"IBM Plex Sans Arabic",sans-serif;direction:rtl}
    .pdf-sheet:before{content:"";position:absolute;width:430px;height:430px;border:1px solid rgba(141,111,58,.24);border-radius:50%;left:-180px;top:-190px}
    .pdf-sheet:after{content:"";position:absolute;width:520px;height:520px;border:1px solid rgba(141,111,58,.16);border-radius:50%;right:-260px;bottom:-300px}
    .pdf-cover{background:#195028;color:#ffffff;padding:48px 52px 42px;position:relative;min-height:260px}
    .pdf-brand{display:flex;align-items:center;justify-content:flex-start}.pdf-logo{display:block;width:310px;height:auto;object-fit:contain}.pdf-kicker{color:#c7aa76;font-size:13px;margin-top:34px}.pdf-title{font-family:"Alexandria";font-size:42px;line-height:1.25;margin:9px 0 0;font-weight:600;letter-spacing:-1px}.pdf-content{padding:40px 52px;position:relative;z-index:2}.pdf-status-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:26px}.pdf-status{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:9px 15px;background:#edf4ef;color:#195028;font-weight:700;font-size:13px}.pdf-status i{width:8px;height:8px;background:#195028;border-radius:50%}.pdf-price-label{font-size:12px;color:#747972}.pdf-price{font-family:"Alexandria";font-size:31px;font-weight:600;margin-top:3px}.pdf-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pdf-info{background:#ffffff;border:1px solid rgba(25,80,40,.10);border-radius:20px;padding:19px 20px;min-height:92px}.pdf-info span{font-size:11px;color:#858880;display:block;margin-bottom:7px}.pdf-info strong{font-size:18px;font-weight:600}.pdf-feature{margin-top:22px;background:#195028;color:#ffffff;border-radius:24px;padding:25px;display:grid;grid-template-columns:1fr 1fr;gap:20px}.pdf-feature span{font-size:11px;color:rgba(255,255,255,.72);display:block;margin-bottom:6px}.pdf-feature strong{font-family:"Alexandria";font-size:22px;color:#c7aa76}.pdf-note{margin-top:26px;border-top:1px solid rgba(25,80,40,.14);padding-top:20px;font-size:12px;color:#747972;line-height:1.9}.pdf-footer{position:absolute;bottom:38px;right:52px;left:52px;display:flex;justify-content:space-between;align-items:end;border-top:1px solid rgba(25,80,40,.14);padding-top:18px;font-size:11px;color:#777a73;z-index:3}.pdf-footer strong{font-family:"Alexandria";color:#195028;font-size:13px}
    .action.pdf{background:var(--green);color:white}.action.download{background:#fff;border:1px solid var(--line);color:var(--ink)}
    .toast{position:fixed;bottom:20px;left:20px;background:var(--ink);color:white;padding:10px 14px;border-radius:12px;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s;z-index:99}.toast.show{opacity:1;transform:none}

    @media(max-width:1180px){.overview{grid-template-columns:repeat(3,1fr)}.stat.primary{grid-column:span 2}.units{grid-template-columns:repeat(4,1fr)}}

    /* Mobile-first sales view */
    @media(max-width:760px){
      body{background:#f7f4ec;padding-bottom:env(safe-area-inset-bottom)}
      .shell{padding:0 0 28px;max-width:none}
      .topbar{position:sticky;top:0;z-index:35;border-radius:0;padding:11px 14px;min-height:68px;justify-content:center;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);box-shadow:0 6px 22px rgba(25,80,40,.08)}
      .topbar:after{display:none}.topbar:before{height:2px}
      .brand{width:100%;justify-content:center}.brand-logo{width:132px;max-width:46vw}.brand-copy,.hero-note{display:none}

      .overview{grid-template-columns:1fr 1fr;gap:8px;margin:10px 10px 8px}
      .stat{padding:12px 13px;min-height:86px;border-radius:18px;box-shadow:0 8px 24px rgba(25,80,40,.06)}
      .stat.primary{grid-column:1/-1;min-height:94px;padding:14px 16px}
      .stat .label{font-size:10px}.stat .value{font-size:22px}.stat.primary .value{font-size:25px}.stat .sub{font-size:9.5px}
      .stat:nth-child(4),.stat:nth-child(5){display:none}

      .toolbar{position:sticky;top:68px;z-index:30;margin:0 10px 10px;padding:9px;background:rgba(247,244,236,.96);backdrop-filter:blur(14px);border-radius:17px;align-items:stretch;flex-direction:column;gap:8px;box-shadow:0 7px 22px rgba(25,80,40,.07)}
      .filters{display:flex;gap:7px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}.filters::-webkit-scrollbar{display:none}
      .chip{flex:0 0 auto;min-height:38px;padding:8px 12px;font-size:11px;white-space:nowrap}
      .search{min-width:0}.search input{height:42px;border-radius:14px;font-size:12px;padding-right:38px}.search span{top:10px}
      .legend{margin:8px 14px 10px;font-size:10px;gap:12px;overflow:hidden}.legend span:last-child{display:none}

      .floor{margin:0 10px 10px;padding:12px;border-radius:20px;background:rgba(255,255,255,.72);box-shadow:0 8px 26px rgba(25,80,40,.06)}
      .floor-head{align-items:flex-start;flex-direction:column;gap:7px;margin-bottom:10px}.floor-title{width:100%;justify-content:space-between}.floor-title h2{font-size:15px}.floor-badge{font-size:10px}.floor-summary{font-size:10px;gap:9px}
      .units{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
      .unit{padding:11px;min-height:154px;border-radius:16px;touch-action:manipulation}.unit:hover{transform:none}.unit:active{transform:scale(.985)}
      .unit-top{margin-bottom:8px}.unit-no{font-size:18px}.category{font-size:9px;padding:3px 6px}.status{font-size:10px}.price{font-size:17px;margin:6px 0 2px}.meta{font-size:10px;line-height:1.55}.quick-share{min-height:36px;margin-top:8px;border-radius:11px;font-size:9.5px;padding:7px 6px}
      .unit.sold{opacity:.72}.unit.sold .sold-stamp{font-size:9px;padding:3px 6px}

      .modal{align-items:flex-end;padding:0;background:rgba(9,11,9,.48)}
      .modal-card{width:100%;max-height:91vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(0,0,0,.22)}
      .modal-head h3{font-size:20px}.close{width:36px;height:36px}.details{grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.detail{padding:10px;border-radius:14px}.detail strong{font-size:13px}.modal-price{padding:13px;border-radius:15px}.modal-price strong{font-size:19px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-width:0;min-height:44px;padding:10px 8px;font-size:11px}.action.secondary{grid-column:1/-1}
      .footer-note{margin:0 12px;padding:10px 2px;flex-direction:column;gap:3px;font-size:9px}
      .toast{left:50%;right:auto;bottom:calc(18px + env(safe-area-inset-bottom));transform:translate(-50%,8px);width:max-content;max-width:calc(100vw - 30px);text-align:center}.toast.show{transform:translate(-50%,0)}
    }
    @media(max-width:390px){
      .brand-logo{width:120px}.overview{gap:7px}.stat{padding:11px}.stat.primary .value{font-size:23px}.units{gap:7px}.unit{padding:10px;min-height:150px}.price{font-size:16px}.quick-share{font-size:9px}.floor-summary span:last-child{display:none}
    }
  </style>
</head>

const floorsOrder=['الأول','الثاني','الثالث','الملحق'];
const money=n=>n?new Intl.NumberFormat('en-US').format(n):'—';
const available=units.filter(x=>x.status==='متاح');
const sold=units.filter(x=>x.status==='مباع');
const remainingValue=available.reduce((s,x)=>s+(x.price||0),0);

const maxPrice=Math.max(...available.map(x=>x.price));

document.getElementById('overview').innerHTML=`

const floorsEl=document.getElementById('floors');
function render(){
 floorsEl.innerHTML=floorsOrder.map(f=>{
   const arr=units.filter(u=>u.floor===f), av=arr.filter(u=>u.status==='متاح').length, so=arr.length-av;
   const value=arr.filter(u=>u.status==='متاح').reduce((s,u)=>s+(u.price||0),0);
   return `<section class="floor" data-floor-wrap="${f}">
    <div class="floor-head"><div class="floor-title"><h2>الدور ${f}</h2><span class="floor-badge">${av} متاح من ${arr.length}</span></div>
    <div class="floor-summary"><span>متاح: <b style="color:var(--green)">${av}</b></span><span>مباع: <b>${so}</b></span><span>قيمة المتاح: <b>${money(value)} ر.س</b></span></div></div>
    <div class="units">${arr.map(unitCard).join('')}</div>
   </section>`
 }).join('');
 document.querySelectorAll('.unit').forEach(el=>el.addEventListener('click',()=>openModal(Number(el.dataset.index))));
}
function unitCard(u){
 const i=units.indexOf(u), cls=u.status==='متاح'?'available':'sold';
 return `<article class="unit ${cls}" data-index="${i}" data-status="${u.status}" data-floor="${u.floor}" data-search="${u.no} ${u.cat} ${u.deed} ${u.front}">
   <div class="unit-top"><div class="unit-no">${u.cat}</div><div class="category">${u.no}</div></div>
   <div class="status">${u.status==='متاح'?'متاح للبيع':'مباع'}</div>
   <div class="price">${u.status==='متاح'?money(u.price):'غير متاح'} ${u.status==='متاح'?'<small>ر.س</small>':''}</div>
   <div class="meta">${u.front}<br>${u.actual.toFixed(2)} م² على الطبيعة</div>
   ${u.status==='متاح'?`<button class="quick-share" onclick="event.stopPropagation();shareUnitPdf(${i})" aria-label="مشاركة عرض PDF للعميل">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Zm0 2.5L17.5 8H14ZM8 13h8v2H8Zm0 4h6v2H8Z"/></svg>
      مشاركة عرض PDF
   </button>`:''}
   <div class="sold-stamp">غير متاح</div>
 </article>`;
}
render();

let state={status:'all',floor:null,q:''};
function applyFilters(){
 document.querySelectorAll('.unit').forEach(el=>{
   const statusOk=state.status==='all'||(state.status==='available'&&el.dataset.status==='متاح')||(state.status==='sold'&&el.dataset.status==='مباع');
   const floorOk=!state.floor||el.dataset.floor===state.floor;
   const qOk=!state.q||el.dataset.search.toLowerCase().includes(state.q);
   el.classList.toggle('hidden',!(statusOk&&floorOk&&qOk));
 });
 document.querySelectorAll('.floor').forEach(f=>f.classList.toggle('hidden',[...f.querySelectorAll('.unit')].every(u=>u.classList.contains('hidden'))));
}
document.querySelectorAll('.chip').forEach(btn=>btn.addEventListener('click',()=>{
 if(btn.dataset.filter){state.status=btn.dataset.filter;state.floor=null;}else{state.floor=state.floor===btn.dataset.floor?null:btn.dataset.floor;state.status='all';}
 document.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
 if(state.floor)btn.classList.add('active'); else document.querySelector(`.chip[data-filter="${state.status}"]`).classList.add('active');
 applyFilters();
}));
document.getElementById('search').addEventListener('input',e=>{state.q=e.target.value.trim().toLowerCase();applyFilters()});

const modal=document.getElementById('modal'), modalCard=document.getElementById('modalCard');
function openModal(i){
 const u=units[i], cls=u.status==='متاح'?'available':'sold';
 modalCard.innerHTML=`<div class="modal-head"><div><h3>الفئة ${u.cat} · الشقة ${u.no}</h3><div class="detail-status ${cls}">${u.status==='متاح'?'● متاحة للبيع الآن':'● مباعة / غير متاحة'}</div></div><button class="close" onclick="closeModal()">✕</button></div>
 <div class="details">
  <div class="detail"><span>الدور</span><strong>${u.floor}</strong></div><div class="detail"><span>الواجهة</span><strong>${u.front}</strong></div>
  <div class="detail"><span>المساحة حسب الصك</span><strong>${u.titleArea} م²</strong></div><div class="detail"><span>المساحة على الطبيعة</span><strong>${u.actual.toFixed(2)} م²</strong></div>
  <div class="detail" style="grid-column:1/-1"><span>رقم الصك</span><strong dir="ltr">${u.deed}</strong></div>
 </div>
 <div class="modal-price"><span>${u.status==='متاح'?'سعر البيع الحالي':'حالة الوحدة'}</span><strong>${u.status==='متاح'?money(u.price)+' ر.س':'غير متاحة للبيع'}</strong></div>
 <div class="actions">
   <button class="action pdf" ${u.status==='مباع'?'disabled style="opacity:.45"':''} onclick="shareUnitPdf(${i})">مشاركة PDF للعميل</button>
   <button class="action download" ${u.status==='مباع'?'disabled style="opacity:.45"':''} onclick="downloadUnitPdf(${i})">تنزيل PDF</button>
   <button class="action whatsapp" ${u.status==='مباع'?'disabled style="opacity:.45"':''} onclick="shareWhatsApp(${i})">واتساب كنص</button>
   <button class="action secondary" onclick="closeModal()">إغلاق</button>
 </div>`;
 modal.classList.add('show');
}
function closeModal(){modal.classList.remove('show')}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

}

function showToast(msg){
 const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);
}
async function createUnitPdfBlob(i){
 const u=units[i];
 if(u.status!=='متاح') return null;
 if(!window.html2canvas || !window.jspdf){showToast('تعذر تحميل أدوات PDF. تحقق من الاتصال بالإنترنت.');throw new Error('PDF libraries unavailable');}
 const stage=document.getElementById('pdfStage');
 stage.innerHTML=pdfSheetHtml(u);
 if(document.fonts && document.fonts.ready) await document.fonts.ready;
 const sheet=document.getElementById('unitPdfSheet');
 await Promise.all([...sheet.querySelectorAll('img')].map(img=>img.complete?Promise.resolve():new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;})));
 const canvas=await html2canvas(sheet,{scale:2,useCORS:true,backgroundColor:'#f7f4ec',logging:false});
 const img=canvas.toDataURL('image/jpeg',0.94);
 const {jsPDF}=window.jspdf;
 const pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});
 pdf.addImage(img,'JPEG',0,0,210,297,undefined,'FAST');
 stage.innerHTML='';
 return pdf.output('blob');
}
async function shareUnitPdf(i){
 const u=units[i];
 if(u.status!=='متاح') return;
 try{
   showToast('جاري تجهيز عرض PDF…');
   const blob=await createUnitPdfBlob(i);
   const filename=`Matall-${u.cat}-${u.no.replace(/\//g,'-')}.pdf`;
   const file=new File([blob],filename,{type:'application/pdf'});
   if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
     await navigator.share({files:[file],title:`عرض الوحدة ${u.cat}`,text:`عرض الوحدة ${u.cat} - الشقة ${u.no} من مطل سكني`});
     showToast('تم فتح خيارات المشاركة — اختر واتساب');
   }else{
     const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
     showToast('تم تنزيل PDF. أرفقه في واتساب من جهازك.');
   }
 }catch(err){
   if(err && err.name==='AbortError') return;
   console.error(err);showToast('تعذر مشاركة PDF على هذا المتصفح');
 }
}
async function downloadUnitPdf(i){
 const u=units[i];
 if(u.status!=='متاح') return;
 try{
   showToast('جاري تجهيز PDF…');
   const blob=await createUnitPdfBlob(i);
   const filename=`Matall-${u.cat}-${u.no.replace(/\//g,'-')}.pdf`;
   const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
   showToast('تم تنزيل عرض الوحدة PDF');
 }catch(err){console.error(err);showToast('تعذر إنشاء PDF');}
}
function copyUnit(i){
 const u=units[i];
 if(u.status!=='متاح') return;
 const txt=shareMessage(u);
 navigator.clipboard.writeText(txt).then(()=>{const t=document.getElementById('toast');t.textContent='تم نسخ رسالة الوحدة للعميل';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)});
}
